<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>学習結果 - FE Learning</title>


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Yu Gothic UI",sans-serif;
        }


        body{
            background:#f4f7fb;
        }


        header{
            background:#0066cc;
            color:white;
            padding:25px;
            text-align:center;
            box-shadow:0 3px 8px rgba(0,0,0,.2);
        }


        header h1{
            font-size:34px;
        }


        header p{
            margin-top:10px;
        }


        .container{
            width:90%;
            max-width:800px;
            margin:40px auto;
        }


        .result-box{
            background:white;
            border-radius:15px;
            padding:35px;
            text-align:center;
            box-shadow:0 4px 10px rgba(0,0,0,.15);
        }


        .result-box h2{
            color:#0066cc;
            margin-bottom:20px;
        }


        .rate{
            font-size:60px;
            font-weight:bold;
            color:#0066cc;
            margin:20px 0;
        }


        .rank{
            font-size:45px;
            font-weight:bold;
            margin:20px 0;
        }


        .result-grid{
            display:grid;
            grid-template-columns:
                repeat(2,1fr);
            gap:15px;
            margin-top:25px;
        }


        .result-item{
            background:#f1f5f9;
            padding:20px;
            border-radius:12px;
        }


        .result-item p{
            color:#666;
            margin-bottom:8px;
        }


        .result-item strong{
            font-size:24px;
            color:#0066cc;
        }


        .level-box{
            margin-top:25px;
            padding:25px;
            background:#eef6ff;
            border-radius:12px;
        }


        .level-box h3{
            color:#0066cc;
            margin-bottom:10px;
        }


        .level-number{
            font-size:35px;
            font-weight:bold;
            color:#0066cc;
        }


        .message{
            margin-top:25px;
            padding:20px;
            background:#eef6ff;
            border-radius:10px;
            font-size:18px;
            line-height:1.7;
        }


        .button{
            width:100%;
            padding:16px;
            margin-top:15px;
            background:#0066cc;
            color:white;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
        }


        .button:hover{
            background:#004f9e;
        }


        footer{
            text-align:center;
            padding:25px;
            color:#777;
        }


        @media(max-width:600px){

            .result-grid{
                grid-template-columns:1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>FE Learning</h1>

    <p>
        学習結果
    </p>

</header>


<div class="container">


    <div class="result-box">


        <h2>
            今回の学習結果
        </h2>


        <div
            class="rate"
            id="correctRate">

            0%

        </div>


        <div class="rank">

            ランク：

            <span id="rank">
                -
            </span>

        </div>



        <div class="result-grid">


            <div class="result-item">

                <p>
                    正解数
                </p>

                <strong id="correctCount">
                    0
                </strong>

            </div>



            <div class="result-item">

                <p>
                    不正解数
                </p>

                <strong id="wrongCount">
                    0
                </strong>

            </div>



            <div class="result-item">

                <p>
                    最高連続正解
                </p>

                <strong id="maxCombo">
                    0
                </strong>

            </div>



            <div class="result-item">

                <p>
                    獲得EXP
                </p>

                <strong id="exp">
                    0
                </strong>

            </div>


        </div>



        <!-- レベル -->

        <div class="level-box">


            <h3>
                現在のレベル
            </h3>


            <div class="level-number">

                Lv.
                <span id="level">
                    1
                </span>

            </div>


            <p>

                累計

                <span id="totalExp">
                    0
                </span>

                EXP

            </p>


        </div>



        <div
            class="message"
            id="message">
        </div>



        <button
            class="button"
            onclick="location.href='study.html'">

            もう一度学習する

        </button>


        <button
            class="button"
            onclick="location.href='index.html'">

            トップページへ戻る

        </button>


    </div>


</div>


<footer>

    © 2026 FE Learning

</footer>


<script>


    /* ===========================
       URLデータ取得
    =========================== */

    const params =

        new URLSearchParams(
            window.location.search
        );


    const correct =

        Number(
            params.get("correct")
        ) || 0;


    const total =

        Number(
            params.get("total")
        ) || 0;


    const rate =

        Number(
            params.get("rate")
        ) || 0;


    const combo =

        Number(
            params.get("combo")
        ) || 0;


    const exp =

        Number(
            params.get("exp")
        ) || 0;


    const wrong =

        total -
        correct;



    /* ===========================
       結果表示
    =========================== */

    document.getElementById(
        "correctRate"
    ).textContent =

        rate +
        "%";


    document.getElementById(
        "correctCount"
    ).textContent =

        correct +
        " / " +
        total;


    document.getElementById(
        "wrongCount"
    ).textContent =

        wrong;


    document.getElementById(
        "maxCombo"
    ).textContent =

        combo +
        "問";


    document.getElementById(
        "exp"
    ).textContent =

        "+" +
        exp +
        " EXP";



    /* ===========================
       ランク
    =========================== */

    let rank;


    if(rate >= 90){

        rank =
            "S";

    }else if(rate >= 80){

        rank =
            "A";

    }else if(rate >= 70){

        rank =
            "B";

    }else if(rate >= 60){

        rank =
            "C";

    }else{

        rank =
            "D";

    }


    document.getElementById(
        "rank"
    ).textContent =
        rank;



    /* ===========================
       現在レベル
    =========================== */

    const totalExp =

        Number(

            localStorage.getItem(
                "totalExp"
            )

        ) || 0;


    const EXP_PER_LEVEL =
        500;


    const level =

        Math.floor(

            totalExp /
            EXP_PER_LEVEL

        ) + 1;


    document.getElementById(
        "level"
    ).textContent =
        level;


    document.getElementById(
        "totalExp"
    ).textContent =
        totalExp;



    /* ===========================
       メッセージ
    =========================== */

    let message;


    if(rate === 100){


        message =
            "パーフェクト！全問正解です！";


    }else if(rate >= 90){


        message =
            "かなり理解できています。この調子で進めましょう！";


    }else if(rate >= 80){


        message =
            "良い結果です。間違えた問題を復習するとさらに伸びます！";


    }else if(rate >= 60){


        message =
            "もう少しです。苦手問題復習を活用してみましょう！";


    }else{


        message =
            "苦手な分野を確認して、もう一度挑戦してみましょう！";

    }


    document.getElementById(
        "message"
    ).textContent =
        message;


</script>


</body>

</html>
