<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ランキング - FE Learning</title>


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Yu Gothic UI",sans-serif;
        }


        body{
            background:#f4f7fb;
        }


        header{
            background:#0066cc;
            color:white;
            padding:25px;
            text-align:center;
            box-shadow:0 3px 8px rgba(0,0,0,.2);
        }


        header h1{
            font-size:34px;
        }


        header p{
            margin-top:10px;
        }


        .container{
            width:90%;
            max-width:1000px;
            margin:40px auto;
        }


        .back{
            display:inline-block;
            margin-bottom:20px;
            color:#0066cc;
            text-decoration:none;
        }


        /* =========================
           プレイヤー情報
        ========================= */

        .player-box{
            background:white;
            border-radius:15px;
            padding:25px;
            margin-bottom:25px;
            box-shadow:0 4px 10px rgba(0,0,0,.15);
        }


        .player-box h2{
            color:#0066cc;
            margin-bottom:20px;
        }


        .player-grid{
            display:grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(170px,1fr)
                );
            gap:15px;
        }


        .player-item{
            background:#f1f5f9;
            border-radius:10px;
            padding:20px;
            text-align:center;
        }


        .player-item p{
            color:#666;
            font-size:14px;
            margin-bottom:8px;
        }


        .player-item strong{
            color:#0066cc;
            font-size:26px;
        }



        /* =========================
           説明
        ========================= */

        .info-box{
            background:#eef6ff;
            border-radius:12px;
            padding:20px;
            margin-bottom:25px;
            line-height:1.7;
            color:#444;
        }



        /* =========================
           ランキング
        ========================= */

        .ranking-box{
            background:white;
            border-radius:15px;
            padding:30px;
            box-shadow:0 4px 10px rgba(0,0,0,.15);
        }


        .ranking-box h2{
            color:#0066cc;
            margin-bottom:20px;
        }


        .ranking-list{
            display:flex;
            flex-direction:column;
            gap:15px;
        }


        .ranking-card{
            display:grid;

            grid-template-columns:
                80px 1fr 130px;

            gap:15px;

            align-items:center;

            padding:20px;

            background:#f8fafc;

            border-radius:12px;

            border:2px solid transparent;
        }


        .ranking-card.first{
            border-color:#f5c542;
        }


        .ranking-card.second{
            border-color:#b8c2cc;
        }


        .ranking-card.third{
            border-color:#c98b58;
        }


        .rank-number{
            text-align:center;
            font-size:26px;
            font-weight:bold;
        }


        .rank-main h3{
            margin-bottom:8px;
            color:#333;
        }


        .rank-main p{
            color:#666;
            font-size:14px;
            line-height:1.6;
        }


        .score{
            text-align:right;
        }


        .score p{
            color:#777;
            font-size:13px;
        }


        .score strong{
            font-size:26px;
            color:#0066cc;
        }


        .empty{
            text-align:center;
            padding:50px 20px;
            color:#777;
            line-height:1.8;
        }


        .study-button{
            display:inline-block;
            margin-top:20px;
            padding:15px 30px;
            background:#0066cc;
            color:white;
            text-decoration:none;
            border-radius:10px;
        }


        footer{
            text-align:center;
            padding:25px;
            color:#777;
        }



        @media(max-width:650px){

            .ranking-card{
                grid-template-columns:
                    60px 1fr;
            }


            .score{
                grid-column:
                    1 / 3;

                text-align:right;
            }

        }


    </style>

</head>


<body>


<header>

    <h1>
        FE Learning
    </h1>

    <p>
        個人ランキング
    </p>

</header>



<div class="container">


    <a
        href="index.html"
        class="back">

        ← トップページに戻る

    </a>



    <!-- =========================
         プレイヤー情報
    ========================== -->

    <div class="player-box">


        <h2>
            🏆 プレイヤー記録
        </h2>


        <div class="player-grid">


            <div class="player-item">

                <p>
                    現在レベル
                </p>

                <strong id="level">
                    Lv.1
                </strong>

            </div>



            <div class="player-item">

                <p>
                    累計EXP
                </p>

                <strong id="totalExp">
                    0
                </strong>

            </div>



            <div class="player-item">

                <p>
                    最高正答率
                </p>

                <strong id="bestRate">
                    0%
                </strong>

            </div>



            <div class="player-item">

                <p>
                    最高コンボ
                </p>

                <strong id="bestCombo">
                    0
                </strong>

            </div>



            <div class="player-item">

                <p>
                    学習回数
                </p>

                <strong id="studyCount">
                    0
                </strong>

            </div>


        </div>


    </div>



    <div class="info-box">

        <strong>
            ランキングスコアについて
        </strong>

        <br>

        正答率と最高連続正解数をもとに、
        過去の学習結果をランキング化しています。

        <br>

        スコア ＝ 正答率 × 100 ＋ 最高コンボ × 10

    </div>



    <!-- =========================
         ランキング
    ========================== -->

    <div class="ranking-box">


        <h2>
            👑 自己ベストランキング TOP10
        </h2>


        <div
            class="ranking-list"
            id="rankingList">
        </div>


    </div>


</div>



<footer>

    © 2026 FE Learning

</footer>



<script>


    /* ========================================
       学習履歴
    ======================================== */

    const history =

        JSON.parse(

            localStorage.getItem(
                "studyHistory"
            )

        ) || [];



    /* ========================================
       EXP・レベル
    ======================================== */

    const totalExp =

        Number(

            localStorage.getItem(
                "totalExp"
            )

        ) || 0;


    const EXP_PER_LEVEL =
        500;


    const level =

        Math.floor(

            totalExp /
            EXP_PER_LEVEL

        ) + 1;



    document.getElementById(
        "level"
    ).textContent =

        "Lv." +
        level;



    document.getElementById(
        "totalExp"
    ).textContent =

        totalExp;



    /* ========================================
       基本記録
    ======================================== */

    let bestRate = 0;

    let bestCombo = 0;



    history.forEach(

        function(record){


            if(
                record.rate >
                bestRate
            ){

                bestRate =
                    record.rate;

            }


            if(
                record.maxCombo >
                bestCombo
            ){

                bestCombo =
                    record.maxCombo;

            }

        }

    );



    document.getElementById(
        "bestRate"
    ).textContent =

        bestRate +
        "%";


    document.getElementById(
        "bestCombo"
    ).textContent =

        bestCombo +
        "問";


    document.getElementById(
        "studyCount"
    ).textContent =

        history.length +
        "回";



    /* ========================================
       カテゴリ名変換
    ======================================== */

    function getCategoryName(category){


        if(
            category ===
            "technology"
        ){

            return "テクノロジ系";

        }


        if(
            category ===
            "management"
        ){

            return "マネジメント系";

        }


        if(
            category ===
            "strategy"
        ){

            return "ストラテジ系";

        }


        if(
            category ===
            "adaptive"
        ){

            return "適応型学習";

        }


        if(
            category ===
            "random"
        ){

            return "ランダム";

        }


        return "通常学習";

    }



    /* ========================================
       スコア計算
    ======================================== */

    function calculateScore(
        record
    ){


        const rate =
            Number(
                record.rate
            ) || 0;


        const combo =
            Number(
                record.maxCombo
            ) || 0;


        return (

            rate * 100 +

            combo * 10

        );

    }



    /* ========================================
       ランキング用データ作成
    ======================================== */

    const rankingData =

        history.map(

            function(record){


                return {

                    date:
                        record.date,

                    category:
                        record.category,

                    correct:
                        record.correct,

                    total:
                        record.total,

                    rate:
                        record.rate,

                    combo:
                        record.maxCombo,

                    score:
                        calculateScore(
                            record
                        )

                };

            }

        );



    /* ========================================
       スコア順に並び替え
    ======================================== */

    rankingData.sort(

        function(a,b){


            /* まずスコア */

            if(
                b.score !==
                a.score
            ){

                return (
                    b.score -
                    a.score
                );

            }


            /* 同点なら正答率 */

            if(
                b.rate !==
                a.rate
            ){

                return (
                    b.rate -
                    a.rate
                );

            }


            /* さらに同点ならコンボ */

            return (
                b.combo -
                a.combo
            );

        }

    );



    /* ========================================
       TOP10だけ取得
    ======================================== */

    const top10 =

        rankingData.slice(
            0,
            10
        );



    const rankingList =

        document.getElementById(
            "rankingList"
        );



    /* ========================================
       履歴がない場合
    ======================================== */

    if(
        top10.length === 0
    ){


        rankingList.innerHTML =

            '<div class="empty">' +

            'まだランキングデータがありません。<br>' +

            '問題を解くと、ここに自己ベストが表示されます。<br>' +

            '<a class="study-button" href="study.html">' +

            '学習を始める' +

            '</a>' +

            '</div>';


    }else{


        /* ====================================
           ランキング表示
        ==================================== */

        top10.forEach(

            function(
                record,
                index
            ){


                const rank =
                    index + 1;


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "ranking-card";



                /* TOP3装飾 */

                if(rank === 1){

                    card.classList.add(
                        "first"
                    );

                }


                if(rank === 2){

                    card.classList.add(
                        "second"
                    );

                }


                if(rank === 3){

                    card.classList.add(
                        "third"
                    );

                }



                /* 順位表示 */

                let rankText;


                if(rank === 1){

                    rankText =
                        "🥇";

                }else if(rank === 2){

                    rankText =
                        "🥈";

                }else if(rank === 3){

                    rankText =
                        "🥉";

                }else{

                    rankText =
                        rank + "位";

                }



                card.innerHTML =

                    '<div class="rank-number">' +

                    rankText +

                    '</div>' +


                    '<div class="rank-main">' +

                    '<h3>' +

                    getCategoryName(
                        record.category
                    ) +

                    '</h3>' +

                    '<p>' +

                    record.correct +

                    ' / ' +

                    record.total +

                    '問正解　｜　' +

                    '正答率 ' +

                    record.rate +

                    '%　｜　' +

                    '最高 ' +

                    record.combo +

                    'コンボ' +

                    '</p>' +

                    '<p>' +

                    record.date +

                    '</p>' +

                    '</div>' +


                    '<div class="score">' +

                    '<p>' +

                    'SCORE' +

                    '</p>' +

                    '<strong>' +

                    record.score +

                    '</strong>' +

                    '</div>';


                rankingList.appendChild(
                    card
                );

            }

        );

    }


</script>


</body>

</html>
