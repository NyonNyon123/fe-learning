<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通常学習 - FE Learning</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Yu Gothic UI",sans-serif;
        }

        body{
            background:#f4f7fb;
        }

        header{
            background:#0066cc;
            color:white;
            padding:25px;
            text-align:center;
            box-shadow:0 3px 8px rgba(0,0,0,.2);
        }

        header h1{
            font-size:34px;
        }

        header p{
            margin-top:10px;
            font-size:16px;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:40px auto;
        }

        .box{
            background:white;
            border-radius:15px;
            padding:30px;
            margin-bottom:25px;
            box-shadow:0 4px 10px rgba(0,0,0,.15);
        }

        .box h2{
            color:#0066cc;
            margin-bottom:20px;
        }

        .category{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:15px;
        }

        .category label{
            border:2px solid #ddd;
            border-radius:10px;
            padding:20px;
            text-align:center;
            cursor:pointer;
            transition:.2s;
        }

        .category label:hover{
            border-color:#0066cc;
            background:#eef6ff;
        }

        .category input{
            margin-right:8px;
        }

        select{
            width:100%;
            padding:12px;
            font-size:16px;
            border-radius:8px;
            border:1px solid #ccc;
        }

        .start-button{
            width:100%;
            padding:18px;
            background:#0066cc;
            color:white;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
            transition:.2s;
        }

        .start-button:hover{
            background:#004f9e;
        }

        .back{
            display:inline-block;
            margin-bottom:20px;
            color:#0066cc;
            text-decoration:none;
        }

        footer{
            text-align:center;
            padding:25px;
            color:#777;
        }
    </style>
</head>

<body>

<header>
    <h1>FE Learning</h1>
    <p>通常学習</p>
</header>

<div class="container">

    <a href="index.html" class="back">
        ← トップページに戻る
    </a>

    <div class="box">
        <h2>学習する分野を選択</h2>

        <div class="category">

            <label>
                <input type="radio"
                       name="category"
                       value="technology"
                       checked>
                テクノロジ系
            </label>

            <label>
                <input type="radio"
                       name="category"
                       value="management">
                マネジメント系
            </label>

            <label>
                <input type="radio"
                       name="category"
                       value="strategy">
                ストラテジ系
            </label>

            <label>
                <input type="radio"
                       name="category"
                       value="random">
                ランダム
            </label>

        </div>
    </div>

    <div class="box">
        <h2>問題数を選択</h2>

        <select id="questionCount">
            <option value="10">10問</option>
            <option value="20">20問</option>
            <option value="30">30問</option>
            <option value="50">50問</option>
        </select>
    </div>

    <div class="box">
        <button class="start-button"
                onclick="startStudy()">
            学習を開始する
        </button>
    </div>

</div>

<footer>
    © 2026 FE Learning
</footer>

<script>

    function startStudy(){

        const category =
            document.querySelector(
                'input[name="category"]:checked'
            ).value;

        const count =
            document.getElementById(
                "questionCount"
            ).value;

        location.href =
            "question.html?category=" +
            category +
            "&count=" +
            count;
    }

</script>

</body>
</html>
