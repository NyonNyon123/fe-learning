<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苦手問題復習 - FE Learning</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Yu Gothic UI",sans-serif;
        }

        body{
            background:#f4f7fb;
        }

        header{
            background:#0066cc;
            color:white;
            padding:25px;
            text-align:center;
            box-shadow:0 3px 8px rgba(0,0,0,.2);
        }

        header h1{
            font-size:34px;
        }

        header p{
            margin-top:10px;
            font-size:16px;
        }

        .container{
            width:90%;
            max-width:850px;
            margin:40px auto;
        }

        .back{
            display:inline-block;
            margin-bottom:20px;
            color:#0066cc;
            text-decoration:none;
        }

        .question-box{
            background:white;
            border-radius:15px;
            padding:30px;
            box-shadow:0 4px 10px rgba(0,0,0,.15);
        }

        .top-info{
            display:flex;
            justify-content:space-between;
            gap:15px;
            flex-wrap:wrap;
            margin-bottom:20px;
            color:#666;
        }

        .question-text{
            font-size:22px;
            line-height:1.7;
            margin-bottom:30px;
        }

        .choice{
            width:100%;
            padding:18px;
            margin-bottom:15px;
            background:white;
            border:2px solid #ddd;
            border-radius:10px;
            font-size:16px;
            text-align:left;
            cursor:pointer;
            transition:.2s;
        }

        .choice:hover{
            border-color:#0066cc;
            background:#eef6ff;
        }

        .choice.correct{
            background:#d4edda;
            border-color:#28a745;
        }

        .choice.wrong{
            background:#f8d7da;
            border-color:#dc3545;
        }

        .result{
            display:none;
            margin-top:25px;
            padding:20px;
            border-radius:10px;
            background:#f1f5f9;
        }

        .result h2{
            margin-bottom:10px;
        }

        .next-button{
            display:none;
            width:100%;
            margin-top:20px;
            padding:16px;
            background:#0066cc;
            color:white;
            border:none;
            border-radius:10px;
            font-size:18px;
            cursor:pointer;
        }

        .next-button:hover{
            background:#004f9e;
        }

        .empty-box{
            background:white;
            border-radius:15px;
            padding:40px;
            text-align:center;
            box-shadow:0 4px 10px rgba(0,0,0,.15);
        }

        .empty-box h2{
            color:#0066cc;
            margin-bottom:15px;
        }

        .home-button{
            display:inline-block;
            margin-top:20px;
            padding:14px 24px;
            background:#0066cc;
            color:white;
            border-radius:10px;
            text-decoration:none;
        }

        footer{
            text-align:center;
            padding:25px;
            color:#777;
        }
    </style>
</head>

<body>

<header>
    <h1>FE Learning</h1>
    <p>苦手問題復習</p>
</header>

<div class="container">

    <a href="index.html" class="back">
        ← トップページに戻る
    </a>

    <div id="reviewArea">

        <div class="question-box" id="questionBox">

            <div class="top-info">
                <span id="questionNumber">問題</span>
                <span id="score">正解数：0</span>
            </div>

            <div class="question-text" id="questionText"></div>

            <div id="choices"></div>

            <div class="result" id="result">
                <h2 id="resultTitle"></h2>
                <p id="explanation"></p>
            </div>

            <button
                class="next-button"
                id="nextButton"
                onclick="nextQuestion()">
                次の問題へ
            </button>

        </div>

    </div>

</div>

<footer>
    © 2026 FE Learning
</footer>

<script src="questions.js"></script>

<script>

    /* ----------------------------
       保存された苦手問題IDを取得
    ---------------------------- */

    let weakQuestionIds =
        JSON.parse(
            localStorage.getItem("weakQuestions")
        ) || [];


    /* ----------------------------
       IDに該当する問題だけ取得
    ---------------------------- */

    let reviewQuestions =
        questions.filter(function(question){

            return weakQuestionIds.includes(
                question.id
            );

        });


    /* ランダムに並び替える */

    reviewQuestions.sort(function(){

        return Math.random() - 0.5;

    });


    /* ----------------------------
       学習状態
    ---------------------------- */

    let currentQuestion = 0;

    let correctCount = 0;

    let answered = false;


    /* ----------------------------
       苦手問題がない場合
    ---------------------------- */

    if(reviewQuestions.length === 0){

        document.getElementById(
            "reviewArea"
        ).innerHTML = `

            <div class="empty-box">

                <h2>苦手問題はありません！</h2>

                <p>
                    通常学習で間違えた問題が、
                    ここに自動で登録されます。
                </p>

                <a href="study.html"
                   class="home-button">
                    通常学習を始める
                </a>

            </div>

        `;

    }else{

        showQuestion();

    }


    /* ----------------------------
       問題表示
    ---------------------------- */

    function showQuestion(){

        answered = false;

        const question =
            reviewQuestions[
                currentQuestion
            ];


        document.getElementById(
            "questionNumber"
        ).textContent =

            "問題 " +
            (currentQuestion + 1) +
            " / " +
            reviewQuestions.length;


        document.getElementById(
            "score"
        ).textContent =

            "正解数：" +
            correctCount;


        document.getElementById(
            "questionText"
        ).textContent =

            question.question;


        const choicesArea =
            document.getElementById(
                "choices"
            );

        choicesArea.innerHTML = "";


        question.choices.forEach(
            function(choice, index){

                const button =
                    document.createElement(
                        "button"
                    );

                button.className =
                    "choice";

                button.textContent =
                    (index + 1) +
                    "．" +
                    choice;


                button.onclick =
                    function(){

                        checkAnswer(
                            button,
                            index
                        );

                    };


                choicesArea.appendChild(
                    button
                );

            }
        );


        document.getElementById(
            "result"
        ).style.display =
            "none";


        document.getElementById(
            "nextButton"
        ).style.display =
            "none";

    }


    /* ----------------------------
       正誤判定
    ---------------------------- */

    function checkAnswer(
        button,
        selectedAnswer
    ){

        if(answered){
            return;
        }

        answered = true;


        const question =
            reviewQuestions[
                currentQuestion
            ];


        const buttons =
            document.querySelectorAll(
                ".choice"
            );


        if(selectedAnswer === question.answer){

            button.classList.add(
                "correct"
            );

            document.getElementById(
                "resultTitle"
            ).textContent =
                "○ 正解！";

            correctCount++;


            /*
              復習で正解した問題は
              苦手問題リストから削除
            */

            removeWeakQuestion(
                question.id
            );

        }else{

            button.classList.add(
                "wrong"
            );

            buttons[
                question.answer
            ].classList.add(
                "correct"
            );

            document.getElementById(
                "resultTitle"
            ).textContent =
                "× 不正解";

        }


        document.getElementById(
            "score"
        ).textContent =

            "正解数：" +
            correctCount;


        document.getElementById(
            "explanation"
        ).textContent =

            question.explanation;


        document.getElementById(
            "result"
        ).style.display =
            "block";


        document.getElementById(
            "nextButton"
        ).style.display =
            "block";

    }


    /* ----------------------------
       苦手問題から削除
    ---------------------------- */

    function removeWeakQuestion(
        questionId
    ){

        let weakQuestions =
            JSON.parse(
                localStorage.getItem(
                    "weakQuestions"
                )
            ) || [];


        weakQuestions =
            weakQuestions.filter(
                function(id){

                    return id !== questionId;

                }
            );


        localStorage.setItem(
            "weakQuestions",
            JSON.stringify(
                weakQuestions
            )
        );

    }


    /* ----------------------------
       次の問題
    ---------------------------- */

    function nextQuestion(){

        currentQuestion++;


        if(
            currentQuestion
            <
            reviewQuestions.length
        ){

            showQuestion();

        }else{

            const rate =
                Math.round(
                    correctCount /
                    reviewQuestions.length
                    * 100
                );


            alert(
                "復習終了！\n\n" +
                reviewQuestions.length +
                "問中 " +
                correctCount +
                "問正解\n\n" +
                "正答率：" +
                rate +
                "%"
            );


            location.href =
                "index.html";

        }

    }

</script>

</body>
</html>
